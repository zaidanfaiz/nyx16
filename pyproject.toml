[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx16"
version = "0.1.0"
description = "Apple A12-A17 iPhone jailbreak research and read-only device/firmware analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
nyx16 = "nyx16.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
