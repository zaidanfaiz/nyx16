name: Nyx16 Firmware Research

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'evidence/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/research.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'evidence/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/research.yml'
  workflow_dispatch:
    inputs:
      firmware_target:
        description: 'Select a baseline or firmware input (iPhone 12 iOS 26.1 is the default)'
        type: choice
        required: true
        default: iphone11-ios26.1
        options:
          - iphone11-ios26.1
          - iphone12-ios26.1
          - custom-ipsw-url
          - public-manifest-url
          - baseline
      ipsw_url:
        description: 'Custom mode only: direct Apple CDN .ipsw URL'
        type: string
        required: false
      manifest_url:
        description: 'Public manifest mode only: raw GitHub BuildManifest.plist URL'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: nyx16-research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Research iPhone 11 and A12-A16 firmware metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Nyx16
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run regression tests (offline fixtures)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Read BuildManifest from Apple IPSW using bounded HTTP ranges
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.firmware_target == 'iphone11-ios26.1' || inputs.firmware_target == 'iphone12-ios26.1' || inputs.firmware_target == 'custom-ipsw-url' }}
        env:
          FIRMWARE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.firmware_target || 'iphone11-ios26.1' }}
          CUSTOM_IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          python tools/partial_ipsw.py \
            --preset "$FIRMWARE_TARGET" \
            --url "$CUSTOM_IPSW_URL" \
            --out evidence/manifests/from-apple-ipsw.plist \
            --metadata-out reports/ipsw_http_source.json
      - name: Read optional public GitHub-hosted manifest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.firmware_target == 'public-manifest-url' }}
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
        run: |
          test -n "$MANIFEST_URL" || { echo "manifest_url is required"; exit 1; }
          python tools/fetch_manifest.py --url "$MANIFEST_URL" --out evidence/manifests/from-dispatch.plist
      - name: Generate compatibility matrices and Secure Boot evidence
        env:
          PYTHONPATH: src
        run: |
          python -m nyx16.research \
            --manifests evidence/manifests \
            --evidence evidence/secure_boot_sources.json \
            --out reports
      - name: Publish GitHub Actions summary
        run: |
          cat reports/RESEARCH_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/ipsw_http_source.json ]; then
            echo "## Source provenance" >> "$GITHUB_STEP_SUMMARY"
            echo 'Apple CDN IPSW read using HTTP Range. See ipsw_http_source.json in artifact for transfer size, SHA256 of the manifest, and validation limits.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyx16-research-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 21
